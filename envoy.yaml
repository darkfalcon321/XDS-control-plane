# This file is run at initial stage only 

node:
  cluster: test-cluster
  id: test-id

dynamic_resources:
  cds_config:
    api_config_source:
      api_type: REST
      transport_api_version: V3
      cluster_names: [controlplane]
      refresh_delay: 5s
  lds_config:
    api_config_source:
      api_type: REST
      transport_api_version: V3
      cluster_names: [controlplane]
      refresh_delay: 5s
      
# Initial setup to reach to the controlplane after which req is sent to cp via xDS reqs
static_resources: 
  clusters:
  - type: STRICT_DNS
    name: controlplane
    load_assignment:
      cluster_name: controlplane
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: controlplane
                port_value: 8050

admin:
  address:
    socket_address:
      address: 0.0.0.0  # NEED TO CHANGE IN PROD
      port_value: 9000